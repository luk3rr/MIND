<article id="item-{{ item.id }}" class="card review-item">
  <form class="stack wide" hx-post="/w/{{ workspace_id }}/review/items/{{ item.id }}" hx-target="#item-{{ item.id }}" hx-swap="outerHTML">
    {% if form_error %}<p class="alert alert-danger" role="alert">{{ form_error }}</p>{% endif %}
    <label for="front-{{ item.id }}">{{ t.review_front }}</label>
    <textarea id="front-{{ item.id }}" name="front" rows="3" required>{{ draft_front if draft_front is defined else item.front }}</textarea>
    <label for="back-{{ item.id }}">{{ t.review_back }}</label>
    <textarea id="back-{{ item.id }}" name="back" rows="3">{{ draft_back if draft_back is defined else item.back }}</textarea>
    <label for="topic-{{ item.id }}">{{ t.review_topic }}</label>
    <input id="topic-{{ item.id }}" name="topic" type="text" value="{{ draft_topic if draft_topic is defined else (item.topic or '') }}">
    <div class="toolbar">
      <button class="btn" type="submit">{{ t.review_save }}</button>
      <button class="btn btn-ghost" type="button" hx-get="/w/{{ workspace_id }}/review/items/{{ item.id }}" hx-target="#item-{{ item.id }}" hx-swap="outerHTML">{{ t.review_cancel_edit }}</button>
    </div>
  </form>
</article>
