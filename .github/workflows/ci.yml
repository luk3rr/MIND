name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Tests
        run: pnpm test --coverage
      - name: Install Xvfb for the Electron end-to-end tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: End-to-end tests
        run: xvfb-run -a pnpm e2e

  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install packaging and test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb lintian desktop-file-utils
      - name: Build the .deb
        run: pnpm package
      - name: Verify the .deb (metadata, contents, size, lintian)
        run: scripts/verify-deb.sh
      - name: Install the package
        run: |
          sudo apt-get install -y ./dist/mind-study_*_amd64.deb
          test -x /usr/bin/mind
          test -f /usr/share/applications/mind.desktop
      - name: End-to-end tests against the installed app
        run: MIND_E2E_EXECUTABLE=/opt/MIND/mind xvfb-run -a pnpm exec playwright test
      - name: Upgrade in place and remove without losing user data
        run: |
          mkdir -p "$HOME/.config/mind"
          echo keep > "$HOME/.config/mind/keep.txt"
          sudo apt-get install -y --reinstall ./dist/mind-study_*_amd64.deb
          test -f "$HOME/.config/mind/keep.txt"
          sudo apt-get remove -y mind-study
          test ! -e /usr/bin/mind
          test ! -e /opt/MIND
          test -f "$HOME/.config/mind/keep.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mind-study-deb
          path: dist/*.deb
