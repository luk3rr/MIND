# Filename: electron-builder.yml
# Created on: November 14, 2026
# Author: Lucas Araújo <araujolucas@dcc.ufmg.br>

appId: io.github.mind-study
productName: MIND
executableName: mind
copyright: AGPL-3.0-or-later

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  # Keep only what the app needs at runtime: no native sources and no other platforms' binaries.
  - "!node_modules/better-sqlite3/{src,deps}/**"
  - "!node_modules/better-sqlite3/prebuilds/{win32-*,darwin-*,linuxmusl-*,linux-arm64}.node"
  - "!node_modules/better-sqlite3/lib/{win32-*,darwin-*,linuxmusl-*,linux-arm64}.js"
  # Semantic search runs the model with onnxruntime-node; the browser runtime and the binaries
  # of other platforms and architectures stay out of the package.
  - "!node_modules/onnxruntime-web/**"
  - "!node_modules/onnxruntime-node/bin/napi-v3/{darwin,win32}/**"
  - "!node_modules/onnxruntime-node/bin/napi-v3/linux/arm64/**"
  - "!node_modules/@img/*{musl,arm,arm64,darwin,win32,s390x,ppc64,riscv64}*/**"

asar: true
# The native SQLite binding cannot be loaded from inside the asar archive.
asarUnpack:
  - node_modules/better-sqlite3/**
  # The OCR engine starts its own worker and reads language data from real files.
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/**
  # The embedding model needs the native onnxruntime (and sharp, which transformers.js loads).
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/sharp/**
  - node_modules/@img/**

linux:
  target:
    - target: deb
      arch:
        - x64
  category: Education
  icon: build/icons
  syncDesktopName: true
  maintainer: Lucas Araújo <araujolucas@dcc.ufmg.br>
  vendor: MIND
  synopsis: Study tool with flashcards and questions that cite your own materials
  description: Generates flashcards and questions that quote your own study materials.
  desktop:
    entry:
      Name: MIND
      Comment: Study with flashcards and questions that cite your materials
      Keywords: study;flashcards;spaced repetition;questions;
      StartupWMClass: mind

deb:
  packageName: mind-study
  compression: xz
  priority: optional
  packageCategory: education
  fpm:
    - build/copyright=/usr/share/doc/mind-study/copyright
